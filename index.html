<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0MRCX LIVRER</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#f2f2f2;
}

header{
  background:#111;
  color:white;
  text-align:center;
  padding:18px;
}

main{
  padding:15px;
  max-width:600px;
  margin:auto;
}

button,
label{
  display:block;
  width:100%;
  padding:17px;
  margin:10px 0;
  border:0;
  border-radius:12px;
  font-size:18px;
  font-weight:bold;
  text-align:center;
  background:#1976d2;
  color:white;
}

.card{
  background:white;
  padding:16px;
  border-radius:12px;
  margin-bottom:15px;
}

.hidden{
  display:none !important;
}

#photo{
  width:100%;
  margin-top:10px;
  border-radius:12px;
  display:none;
}

.client{
  background:white;
  padding:15px;
  margin:12px 0;
  border-radius:12px;
}

.green{
  background:#16a34a;
}

.red{
  background:#dc2626;
}

.gray{
  background:#777;
}

input[type="file"]{
  display:block;
  width:100%;
  padding:12px;
  font-size:16px;
}
</style>
</head>

<body>

<header>
<h1>🚚 0MRCX LIVRER</h1>
</header>

<main>

<!-- ACCUEIL -->

<div id="accueil">

<div class="card">
<h2>📋 Tableau de bord</h2>
<p id="date"></p>
<p>Clients : <b id="nbClients">0</b></p>
<p>Morceaux livrés : <b id="nbPieces">0</b></p>
</div>

<button id="btnJournee">
➕ Ajouter journée
</button>

<div class="card">

<h3>📷 Photo de la feuille</h3>

<input
id="photoInput"
type="file"
accept="image/*"
capture="environment"
>

<img
id="photo"
>

</div>

<button id="btnHistorique">
📅 Historique
</button>

</div>


<!-- JOURNÉE -->

<div id="journee" class="hidden">

<button
id="btnRetour"
class="gray">
⬅️ Retour
</button>

<div class="card">

<h2>🚚 Journée</h2>

<p id="dateJournee"></p>

<p>
Clients :
<b id="totalClients">0</b>
</p>

<p>
Morceaux livrés :
<b id="totalPieces">0</b>
</p>

</div>

<div id="clients"></div>

</div>


<!-- HISTORIQUE -->

<div id="historique" class="hidden">

<button
id="btnRetourHist"
class="gray">
⬅️ Retour
</button>

<div class="card">

<h2>📅 Historique</h2>

<div id="historiqueListe"></div>

</div>

</div>

</main>


<script>

let journee = null;

let historique =
JSON.parse(
localStorage.getItem("0mrcx_historique")
) || [];


/* DATE */

function dateAujourdHui(){

return new Date()
.toLocaleDateString("fr-CA");

}


/* SAUVEGARDE */

function sauvegarder(){

localStorage.setItem(
"0mrcx_historique",
JSON.stringify(historique)
);

}


/* AFFICHAGE */

function afficherAccueil(){

document
.getElementById("accueil")
.classList.remove("hidden");

document
.getElementById("journee")
.classList.add("hidden");

document
.getElementById("historique")
.classList.add("hidden");

}


function afficherJournee(){

document
.getElementById("accueil")
.classList.add("hidden");

document
.getElementById("journee")
.classList.remove("hidden");

document
.getElementById("historique")
.classList.add("hidden");

}


function afficherHistorique(){

document
.getElementById("accueil")
.classList.add("hidden");

document
.getElementById("journee")
.classList.add("hidden");

document
.getElementById("historique")
.classList.remove("hidden");

afficherListeHistorique();

}


/* NOUVELLE JOURNÉE */

function nouvelleJournee(){

journee={

date:dateAujourdHui(),

clients:[

{
numero:1,
nom:"Client 001",
adresse:"Adresse à ajouter",
pieces:["Laveuse"],
fait:false
},

{
numero:2,
nom:"Client 002",
adresse:"Adresse à ajouter",
pieces:["Sécheuse"],
fait:false
}

]

};


let index =
historique.findIndex(
j=>j.date===journee.date
);

if(index===-1){

historique.push(journee);

}else{

historique[index]=journee;

}

sauvegarder();

afficherJournee();

afficherClients();

}


/* CLIENTS */

function afficherClients(){

let zone =
document.getElementById("clients");

zone.innerHTML="";


journee.clients.forEach(
(client,index)=>{

let div =
document.createElement("div");

div.className="client";


let pieces="";

client.pieces.forEach(
piece=>{

pieces +=
"<p>📦 "+piece+"</p>";

});


div.innerHTML=

"<h2>"+client.nom+"</h2>"+
"<p>📍 "+client.adresse+"</p>"+
"<h3>Appareils</h3>"+
pieces+

"<button class='green' "+
"data-action='fait' "+
"data-index='"+index+"'>"+
(client.fait
?"✅ Client fait"
:"🚚 Client fait")+
"</button>"+

"<button class='gray' "+
"data-action='piece' "+
"data-index='"+index+"'>"+
"➕ Ajouter un morceau"+
"</button>";


zone.appendChild(div);

});


zone
.querySelectorAll("button")
.forEach(
bouton=>{

bouton.addEventListener(
"click",
function(){

let index =
Number(this.dataset.index);

let action =
this.dataset.action;


if(action==="fait"){

journee
.clients[index]
.fait=true;

sauvegarderJournee();

afficherClients();

}


if(action==="piece"){

let piece =
prompt(
"Nom du morceau ou appareil :"
);

if(piece){

journee
.clients[index]
.pieces
.push(piece);

sauvegarderJournee();

afficherClients();

}

}

});

});

mettreAJourCompteurs();

}


/* SAUVEGARDE JOURNÉE */

function sauvegarderJournee(){

let index =
historique.findIndex(
j=>j.date===journee.date
);

if(index===-1){

historique.push(journee);

}else{

historique[index]=journee;

}

sauvegarder();

}


/* COMPTEURS */

function mettreAJourCompteurs(){

let total =
journee.clients.length;

let pieces=0;

journee.clients.forEach(
client=>{

if(client.fait){

pieces +=
client.pieces.length;

}

});


document
.getElementById("totalClients")
.textContent=total;

document
.getElementById("totalPieces")
.textContent=pieces;

document
.getElementById("nbClients")
.textContent=total;

document
.getElementById("nbPieces")
.textContent=pieces;

}


/* HISTORIQUE */

function afficherListeHistorique(){

let zone =
document.getElementById(
"historiqueListe"
);

zone.innerHTML="";


if(historique.length===0){

zone.innerHTML=
"<p>Aucune journée.</p>";

return;

}


historique
.slice()
.reverse()
.forEach(
j=>{

let bouton =
document.createElement("button");

bouton.className="gray";

bouton.textContent=
"📅 "+j.date+
" - "+
j.clients.length+
" clients";

zone.appendChild(bouton);

});

}


/* PHOTO */

document
.getElementById("photoInput")
.addEventListener(
"change",
function(){

let fichier=this.files[0];

if(!fichier){
return;
}

let lecteur =
new FileReader();

lecteur.onload=
function(e){

let image =
document.getElementById("photo");

image.src=e.target.result;

image.style.display="block";

};

lecteur.readAsDataURL(fichier);

});


/* BOUTONS PRINCIPAUX */

document
.getElementById("btnJournee")
.addEventListener(
"click",
nouvelleJournee
);


document
.getElementById("btnHistorique")
.addEventListener(
"click",
afficherHistorique
);


document
.getElementById("btnRetour")
.addEventListener(
"click",
afficherAccueil
);


document
.getElementById("btnRetourHist")
.addEventListener(
"click",
afficherAccueil
);


/* INITIALISATION */

document
.getElementById("date")
.textContent=
dateAujourdHui();

</script>

</body>
</html>
