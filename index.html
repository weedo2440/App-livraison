<style>

body{

.card{

.blue{

#photoPreview{

}

.piece{

padding:9px;
border-radius:8px;
margin:5px 0;
}

.deletePiece{
width:auto;
margin:0;
padding:7px 10px;
background:#ef4444;
color:white;
}

.choice{
display:flex;
gap:7px;
}

.choice button{
flex:1;
}

.activeGreen{
background:#16a34a!important;
color:white!important;
}

.activeRed{
background:#dc2626!important;
color:white!important;
}

.activeBlue{
background:#2563eb!important;
color:white!important;
}

.summaryLine{
background:#f5f5f5;
padding:9px;
border-radius:8px;
margin:5px 0;
}

.historyItem{
text-align:left;
background:white;
border:2px solid #ddd;
}

.removeClient{
background:#fee2e2;
color:#991b1b;
}

hr{
border:0;
border-top:1px solid #ddd;
margin:15px 0;
}

</style>

</head>


<body>

DÉTAIL HISTORIQUE

<div class="stats">


<div class="stat">

<div

id="detailClients">

0

</div>

<div class="small">
Clients
</div>

</div>


<div class="stat">

<script>

"use strict";


/* =========================
DONNÉES
========================= */

let currentDay=null;

let historyData=[];

let selectedPhoto=null;


try{

const saved=
localStorage.getItem(
"omrcx_history"
);

if(saved){

historyData=
JSON.parse(saved);

}

if(!Array.isArray(historyData)){

historyData=[];

}

}catch(error){

historyData=[];

try{

localStorage.removeItem(
"omrcx_history"
);

}catch(e){}

}


/* =========================
OUTILS
========================= */

function today(){

return new Date()
.toLocaleDateString(
"fr-CA"
);

}


function timeNow(){

return new Date()
.toLocaleTimeString(
"fr-CA",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function save(){

try{

localStorage.setItem(
"omrcx_history",
JSON.stringify(
historyData
)
);

}catch(error){

console.log(error);

}

}


function show(id){

document
.querySelectorAll(
"main section"
)
.forEach(
section=>{
section.classList.add(
"hidden"
);
}
);

document
.getElementById(id)
.classList.remove(
"hidden"
);

}


function escapeHTML(text){

return String(text||"")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function mapsLink(address){

return "https://www.google.com/maps/dir/?api=1&destination="+
encodeURIComponent(address);

}


function imageSearchLink(address){

return "https://www.google.com/search?tbm=isch&q="+
encodeURIComponent(address);

}


/* =========================
COMPTEURS
========================= */

function countPieces(day){

if(
!day ||
!Array.isArray(day.clients)
){

return 0;

}


let total=0;


day.clients.forEach(
client=>{

if(client.fait){

total+=
Array.isArray(client.pieces)
?
client.pieces.length
:
0;

}

});


return total;

}


function updateCounters(){

if(!currentDay){

return;

}


document
.getElementById(
"dayClients"
)
.textContent=
currentDay.clients.length;


document
.getElementById(
"dayPieces"
)
.textContent=
countPieces(
currentDay
);


document
.getElementById(
"homeClients"
)
.textContent=
currentDay.clients.length;


document
.getElementById(
"homePieces"
)
.textContent=
countPieces(
currentDay
);

}


/* =========================
JOURNÉE
========================= */

function createDay(){

currentDay={

date:today(),

clients:[]

};


historyData.push(
currentDay
);

save();


show("day");

renderDay();

}


function saveCurrentDay(){

if(!currentDay){

return;

}


let index=
historyData.findIndex(
day=>day===currentDay
);


if(index>=0){

historyData[index]=
currentDay;

}else{

historyData.push(
currentDay
);

}


save();

}


function addClient(){

if(!currentDay){

createDay();

return;

}


const number=
currentDay.clients.length+1;


currentDay.clients.push({

numero:number,

nom:
"Client "+
String(number)
.padStart(3,"0"),

adresse:"",

pieces:[],

appele:null,

vieux:null,

fait:false,

heure:null

});


saveCurrentDay();

renderDay();

}


function removeClient(index){

if(
!confirm(
"Supprimer ce client ?"
)
){

return;

}


currentDay.clients.splice(
index,
1
);


currentDay.clients.forEach(
(client,i)=>{

client.numero=i+1;

});


saveCurrentDay();

renderDay();

}


/* =========================
AFFICHAGE JOURNÉE
========================= */

function renderDay(){

if(!currentDay){

return;

}


document
.getElementById(
"dayDate"
)
.textContent=
currentDay.date;


updateCounters();

renderClients();

renderSummary();

}


/* =========================
CLIENTS
========================= */

function renderClients(){

const list=
document.getElementById(
"clientsList"
);

list.innerHTML="";


if(
currentDay.clients.length===0
){

list.innerHTML=`

<div class="card">

<p>
Aucun client pour l'instant.
</p>

<p class="small">

Ajoute les clients manuellement
ou utilise la lecture de la feuille.

</p>

</div>

`;

return;

}


currentDay.clients.forEach(
(client,index)=>{


const box=
document.createElement(
"div"
);


box.className=
"client"+
(
client.fait
?
" done"
:
""
);


let piecesHTML="";


client.pieces.forEach(
(piece,pieceIndex)=>{


piecesHTML+=`

<div class="piece">

<span>
📦 ${escapeHTML(piece)}
</span>

<button
class="deletePiece"
data-client="${index}"
data-delete-piece="${pieceIndex}">

✕

</button>

</div>

`;

});


box.innerHTML=`

<div class="clientNumber">

CLIENT
${String(client.numero)
.padStart(3,"0")}

</div>


<h2>

${escapeHTML(
client.nom
)}

</h2>


<label>
Nom du client
</label>


<input
class="clientName"
data-index="${index}"
value="${escapeHTML(client.nom)}"
>


<label>
📍 Adresse
</label>


<input
class="clientAddress"
data-index="${index}"
value="${escapeHTML(client.adresse)}"
placeholder="Adresse complète"
>


<div class="row">

<button
class="blue"
data-map="${index}">

🗺️ Google Maps

</button>


<button
class="gray"
data-image="${index}">

🖼️ Images

</button>

</div>


<div class="choiceTitle">

📦 Appareils / morceaux

</div>


${piecesHTML}


<button
class="gray"
data-add-piece="${index}">

➕ Ajouter un morceau

</button>


<div class="choiceTitle">

📞 Appelé

</div>


<div class="choice">


<button
class="${
client.appele===true
?
"activeBlue"
:
""
}"
data-call="yes"
data-index="${index}">

📞 Oui

</button>


<button
class="${
client.appele===false
?
"activeRed"
:
""
}"
data-call="no"
data-index="${index}">

❌ Pas répondu

</button>


</div>


<div class="choiceTitle">

♻️ Vieux

</div>


<div class="choice">


<button
class="${
client.vieux===true
?
"activeGreen"
:
""
}"
data-old="yes"
data-index="${index}">

🟢 Vieux rapporté

</button>


<button
class="${
client.vieux===false
?
"activeRed"
:
""
}"
data-old="no"
data-index="${index}">

🔴 Pas de vieux

</button>


</div>


<button
class="${
client.fait
?
"green"
:
"blue"
}"
data-done="${index}">

${
client.fait
?
"✅ Client fait à "+
client.heure
:
"🚚 Client fait"
}

</button>


<button
class="removeClient"
data-remove="${index}">

🗑️ Supprimer ce client

</button>

`;


list.appendChild(box);

});


/* NOM */

document
.querySelectorAll(
".clientName"
)
.forEach(
input=>{

input.addEventListener(
"change",
function(){

const index=
Number(
this.dataset.index
);


currentDay
.clients[index]
.nom=
this.value;


saveCurrentDay();

renderSummary();

});

});


/* ADRESSE */

document
.querySelectorAll(
".clientAddress"
)
.forEach(
input=>{

input.addEventListener(
"change",
function(){

const index=
Number(
this.dataset.index
);


currentDay
.clients[index]
.adresse=
this.value;


saveCurrentDay();

renderSummary();

});

});


/* MAPS */

document
.querySelectorAll(
"[data-map]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.map
);


const address=
currentDay
.clients[index]
.adresse;


if(!address){

alert(
"Ajoute d'abord l'adresse."
);

return;

}


window.open(
mapsLink(address),
"_blank"
);

});

});


/* IMAGES */

document
.querySelectorAll(
"[data-image]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.image
);


const address=
currentDay
.clients[index]
.adresse;


if(!address){

alert(
"Ajoute d'abord l'adresse."
);

return;

}


window.open(
imageSearchLink(address),
"_blank"
);

});

});


/* AJOUT MORCEAU */

document
.querySelectorAll(
"[data-add-piece]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.addPiece
);


const piece=
prompt(
"Nom de l'appareil ou du morceau :"
);


if(!piece){

return;

}


currentDay
.clients[index]
.pieces
.push(piece);


saveCurrentDay();

renderDay();

});

});


/* SUPPRIMER MORCEAU */

document
.querySelectorAll(
"[data-delete-piece]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const clientIndex=
Number(
this.dataset.client
);


const pieceIndex=
Number(
this.dataset.deletePiece
);


currentDay
.clients[clientIndex]
.pieces
.splice(
pieceIndex,
1
);


saveCurrentDay();

renderDay();

});

});


/* APPELÉ */

document
.querySelectorAll(
"[data-call]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.index
);


currentDay
.clients[index]
.appele=
this.dataset.call==="yes";


saveCurrentDay();

renderDay();

});

});


/* VIEUX */

document
.querySelectorAll(
"[data-old]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.index
);


currentDay
.clients[index]
.vieux=
this.dataset.old==="yes";


saveCurrentDay();

renderDay();

});

});


/* CLIENT FAIT */

document
.querySelectorAll(
"[data-done]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

const index=
Number(
this.dataset.done
);


const client=
currentDay.clients[index];


client.fait=
!client.fait;


client.heure=
client.fait
?
timeNow()
:
null;


saveCurrentDay();

renderDay();

});

});


/* SUPPRIMER CLIENT */

document
.querySelectorAll(
"[data-remove]"
)
.forEach(
button=>{

button.addEventListener(
"click",
function(){

removeClient(
Number(
this.dataset.remove
)
);

});

});

}


/* =========================
RÉSUMÉ
========================= */

function renderSummary(){

const box=
document.getElementById(
"routeSummary"
);


if(
!currentDay ||
currentDay.clients.length===0
){

box.innerHTML=
"Aucun client.";

return;

}


box.innerHTML="";


currentDay.clients.forEach(
(client,index)=>{


const line=
document.createElement(
"div"
);


line.className=
"summaryLine";


line.innerHTML=

"<strong>"+
String(index+1)
.padStart(3,"0")+
"</strong> · "+
escapeHTML(
client.nom
)+
"<br>"+
(
client.adresse
?
"📍 "+
escapeHTML(
client.adresse
)
:
"⚠️ Adresse manquante"
);


box.appendChild(line);

});

}


/* =========================
GOOGLE MAPS
========================= */

function openAllMaps(){

if(
!currentDay ||
currentDay.clients.length===0
){

alert(
"Aucun client."
);

return;

}


const valid=
currentDay.clients.filter(
client=>client.adresse
);


if(valid.length===0){

alert(
"Aucune adresse."
);

return;

}


const destination=
valid[
valid.length-1
]
.adresse;


const waypoints=
valid
.slice(0,-1)
.map(
client=>client.adresse
)
.join("|");


let url=
"https://www.google.com/maps/dir/?api=1"+
"&destination="+
encodeURIComponent(
destination
);


if(waypoints){

url+=
"&waypoints="+
encodeURIComponent(
waypoints
);

}


url+="&travelmode=driving";


window.open(
url,
"_blank"
);

}


function optimizeRoute(){

if(
!currentDay ||
currentDay.clients.length<2
){

alert(
"Il faut au moins 2 clients."
);

return;

}


const addresses=
currentDay.clients
.filter(
client=>client.adresse
)
.map(
client=>client.adresse
);


if(addresses.length<2){

alert(
"Il faut au moins 2 adresses."
);

return;

}


const destination=
addresses[
addresses.length-1
];


const waypoints=
addresses
.slice(0,-1)
.join("|");


const url=
"https://www.google.com/maps/dir/?api=1"+
"&destination="+
encodeURIComponent(
destination
)+
"&waypoints="+
encodeURIComponent(
waypoints
)+
"&travelmode=driving";


window.open(
url,
"_blank"
);

}


/* =========================
PHOTO COMMUNE
========================= */

function handlePhoto(file){

if(!file){

return;

}


selectedPhoto=file;


const reader=
new FileReader();


reader.onload=
function(event){

const image=
document.getElementById(
"photoPreview"
);


image.src=
event.target.result;


image.style.display=
"block";


document
.getElementById(
"ocrBtn"
)
.classList.remove(
"hidden"
);

};


reader.readAsDataURL(
file
);

}


/* =========================
CAMÉRA
========================= */

document
.getElementById(
"cameraBtn"
)
.addEventListener(
"click",
function(){

document
.getElementById(
"cameraInput"
)
.click();

});


document
.getElementById(
"cameraInput"
)
.addEventListener(
"change",
function(){

handlePhoto(
this.files[0]
);

});


/* =========================
GALERIE
========================= */

document
.getElementById(
"galleryBtn"
)
.addEventListener(
"click",
function(){

document
.getElementById(
"galleryInput"
)
.click();

});


document
.getElementById(
"galleryInput"
)
.addEventListener(
"change",
function(){

handlePhoto(
this.files[0]
);

});


/* =========================
OCR
========================= */

document
.getElementById(
"ocrBtn"
)
.addEventListener(
"click",
async function(){


if(!selectedPhoto){

return;

}


const status=
document.getElementById(
"ocrStatus"
);


status.classList.remove(
"hidden"
);


status.textContent=
"⏳ Lecture de la feuille...";


try{


const result=
await Tesseract.recognize(
selectedPhoto,
"fra+eng",
{

logger:function(info){

if(
info.status===
"recognizing text"
){

status.textContent=
"🔎 Lecture : "+
Math.round(
info.progress*100
)+
"%";

}

}

}
);


const text=
result.data.text.trim();


if(!text){

status.textContent=
"❌ Aucun texte détecté.";

return;

}


status.textContent=
"✅ Texte détecté.";


parseOCR(text);


}catch(error){

console.log(error);


status.textContent=
"❌ Impossible de lire la photo.";

}

});


/* =========================
OCR -> CLIENTS
========================= */

function parseOCR(text){

if(!currentDay){

createDay();

}


const lines=
text
.split(/\r?\n/)
.map(
line=>line.trim()
)
.filter(
line=>line.length>=5
);


if(lines.length===0){

return;

}


/*
On utilise les lignes détectées comme
base de clients.

Tu peux ensuite corriger chaque
nom et chaque adresse directement
dans l'application.
*/


currentDay.clients=[];


lines
.slice(0,40)
.forEach(
(line,index)=>{


currentDay.clients.push({

numero:index+1,

nom:
"Client "+
String(index+1)
.padStart(3,"0"),

adresse:line,

pieces:[],

appele:null,

vieux:null,

fait:false,

heure:null

});

});


saveCurrentDay();

show("day");

renderDay();

}


/* =========================
HISTORIQUE
========================= */

function renderHistory(){

const box=
document.getElementById(
"historyList"
);


box.innerHTML="";


if(
historyData.length===0
){

box.innerHTML=
"<p>Aucune journée enregistrée.</p>";

return;

}


historyData
.slice()
.reverse()
.forEach(
(day,reverseIndex)=>{


const realIndex=
historyData.length-
1-
reverseIndex;


const button=
document.createElement(
"button"
);


button.className=
"historyItem";


button.innerHTML=

"📅 <strong>"+
escapeHTML(
day.date
)+
"</strong>"+
"<br>"+
"<span class='small'>"+
day.clients.length+
" clients · "+
countPieces(day)+
" morceaux livrés"+
"</span>";


button.addEventListener(
"click",
function(){

openHistoryDetail(
realIndex
);

});


box.appendChild(button);

});

}


/* =========================
DÉTAIL HISTORIQUE
========================= */

function openHistoryDetail(index){

const day=
historyData[index];


if(!day){

return;

}


document
.getElementById(
"detailTitle"
)
.textContent=
"📅 "+day.date;


document
.getElementById(
"detailClients"
)
.textContent=
day.clients.length;


document
.getElementById(
"detailPieces"
)
.textContent=
countPieces(day);


const box=
document.getElementById(
"detailClientsList"
);


box.innerHTML="";


day.clients.forEach(
client=>{


const div=
document.createElement(
"div"
);


div.className=
"client";


let pieces="";


client.pieces.forEach(
piece=>{

pieces+=
"<p>📦 "+
escapeHTML(piece)+
"</p>";

});


div.innerHTML=

"<div class='clientNumber'>"+
"CLIENT "+
String(client.numero)
.padStart(3,"0")+
"</div>"+

"<h2>"+
escapeHTML(
client.nom
)+
"</h2>"+

"<p>📍 "+
escapeHTML(
client.adresse
)+
"</p>"+

"<p>"+
(
client.fait
?
"✅ Fait à "+
client.heure
:
"⏳ Pas fait"
)+
"</p>"+

pieces;


box.appendChild(div);

});


show(
"historyDetail"
);

}

/* =========================

========================= */

.getElementById(
"today"
)
.textContent=
today();

.getElementById(
"homeClients"
)
.textContent=
currentDay.clients.length;


document
.getElementById(
"homePieces"
)

.getElementById(
"homeClients"
)
.textContent=

.getElementById(
"homePieces"
)
