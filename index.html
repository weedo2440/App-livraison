<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>0MRCX LIVRER</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f1f3f5;color:#222}
header{background:#111827;color:white;padding:16px;text-align:center}
header h1{margin:0;font-size:22px}
main{max-width:600px;margin:auto;padding:15px}

.card,.client{
 background:white;
 padding:16px;
 margin-bottom:15px;
 border-radius:14px;
 box-shadow:0 2px 8px #0002;
}

button{
 border:0;
 border-radius:10px;
 padding:14px;
 font-size:16px;
 font-weight:bold;
 cursor:pointer;
}

.menuButton{
 width:100%;
 margin-bottom:10px;
 background:#2563eb;
 color:white;
}

.secondary{background:#e5e7eb;color:#111}
.back{width:100%;margin-bottom:15px;background:#e5e7eb}

.choiceTitle{
 font-weight:bold;
 margin-top:15px;
 margin-bottom:7px;
}

.choices{display:flex;gap:8px}

.choice{
 flex:1;
 background:white;
 color:#222;
 border:2px solid #ddd;
}

.choice.yes.active{
 background:#22c55e;
 color:white;
 border-color:#22c55e;
}

.choice.no.active{
 background:#ef4444;
 color:white;
 border-color:#ef4444;
}

.done{
 width:100%;
 margin-top:15px;
 background:white;
 color:#15803d;
 border:2px solid #22c55e;
}

.done.active{
 background:#22c55e;
 color:white;
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:8px;
}

.stat{
 background:#f8f9fa;
 padding:12px;
 border-radius:10px;
 text-align:center;
}

.stat strong{
 display:block;
 font-size:22px;
}

.small{color:#666;font-size:14px}

.piece{
 display:flex;
 justify-content:space-between;
 align-items:center;
 background:#f3f4f6;
 padding:10px;
 border-radius:8px;
 margin:5px 0;
}

.deletePiece{
 padding:7px 10px;
 background:#ef4444;
 color:white;
}

.addPiece{
 width:100%;
 margin-top:8px;
 background:#e5e7eb;
}

.hidden{display:none}

.historyButton{
 width:100%;
 background:white;
 color:#222;
 border:2px solid #ddd;
 margin-bottom:8px;
 text-align:left;
}

.photoPreview{
 width:100%;
 max-height:400px;
 object-fit:contain;
 margin-top:10px;
 border-radius:10px;
 display:none;
}
</style>
</head>

<body>

<header>
<h1>🚚 0MRCX LIVRER</h1>
</header>

<main>

<section id="accueil">

<div class="card">
<h2>📅 Aujourd'hui</h2>
<p id="dateAujourdHui"></p>

<div class="stats">
<div class="stat">
<strong id="clientsAujourdHui">0</strong>
<span class="small">Clients</span>
</div>

<div class="stat">
<strong id="morceauxAujourdHui">0</strong>
<span class="small">Morceaux livrés</span>
</div>
</div>
</div>

<button class="menuButton" onclick="nouvelleJournee()">
➕ Ajouter journée
</button>

<button class="menuButton" onclick="ouvrirPhoto()">
📷 Photo de la feuille
</button>

<input
 type="file"
 id="photoFeuille"
 accept="image/*"
 capture="environment"
 style="display:none"
 onchange="photoChoisie(event)"
>

<img id="photoPreview" class="photoPreview">

<button class="menuButton secondary" onclick="afficherHistorique()">
📅 Historique
</button>

</section>


<section id="route" class="hidden">

<button class="back" onclick="retourAccueil()">
⬅️ Retour
</button>

<div class="card">
<h2>🚚 Ma journée</h2>
<p id="dateRoute"></p>

<div class="stats">

<div class="stat">
<strong id="totalClients">0</strong>
<span class="small">Clients</span>
</div>

<div class="stat">
<strong id="totalMorceaux">0</strong>
<span class="small">Morceaux livrés</span>
</div>

</div>
</div>

<div id="listeClients"></div>

</section>


<section id="historique" class="hidden">

<button class="back" onclick="retourAccueil()">
⬅️ Retour
</button>

<div class="card">
<h2>📅 Historique</h2>
<div id="listeHistorique"></div>
</div>

</section>


<section id="detailHistorique" class="hidden">

<button class="back" onclick="afficherHistorique()">
⬅️ Retour
</button>

<div class="card">
<h2 id="titreDetail"></h2>

<div class="stats">

<div class="stat">
<strong id="detailClients">0</strong>
<span class="small">Clients</span>
</div>

<div class="stat">
<strong id="detailMorceaux">0</strong>
<span class="small">Morceaux livrés</span>
</div>

</div>
</div>

<div class="card">
<h3>📦 Morceaux livrés</h3>
<div id="detailMorceauxListe"></div>
</div>

</section>

</main>


<script>

let journeeActuelle=null;

let historique=
JSON.parse(localStorage.getItem("historiqueLivraison"))||[];


function obtenirDate(){
 return new Date().toLocaleDateString("fr-CA");
}


function obtenirHeure(){
 return new Date().toLocaleTimeString(
  "fr-CA",
  {
   hour:"2-digit",
   minute:"2-digit"
  }
 );
}


function sauvegarder(){
 localStorage.setItem(
  "historiqueLivraison",
  JSON.stringify(historique)
 );
}


function nouvelleJournee(){

journeeActuelle={
 date:obtenirDate(),

 clients:[
  {
   numero:1,
   nom:"Client 001",
   adresse:"Adresse à ajouter",
   morceaux:["Laveuse"],
   appele:null,
   vieux:null,
   fait:false,
   heure:null
  },

  {
   numero:2,
   nom:"Client 002",
   adresse:"Adresse à ajouter",
   morceaux:["Sécheuse","Pièce"],
   appele:null,
   vieux:null,
   fait:false,
   heure:null
  }
 ]
};

sauvegarderJournee();
afficherRoute();
}


function sauvegarderJournee(){

if(!journeeActuelle)return;

let position=
historique.findIndex(
 j=>j.date===journeeActuelle.date
);

if(position>=0){
 historique[position]=journeeActuelle;
}else{
 historique.push(journeeActuelle);
}

sauvegarder();
}


function afficherRoute(){

cacherToutesLesSections();

document
 .getElementById("route")
 .classList.remove("hidden");

document.getElementById("dateRoute")
 .textContent=journeeActuelle.date;

afficherClients();
}


function afficherClients(){

const liste=
document.getElementById("listeClients");

liste.innerHTML="";

journeeActuelle.clients.forEach(
(client,index)=>{

const div=
document.createElement("div");

div.className="client";

let morceauxHTML="";

client.morceaux.forEach(
(morceau,pieceIndex)=>{

morceauxHTML+=`

<div class="piece">

<span>📦 ${morceau}</span>

<button
class="deletePiece"
onclick="supprimerMorceau(${index},${pieceIndex})">
✕
</button>

</div>

`;
});


div.innerHTML=`

<div class="small">
CLIENT ${String(client.numero).padStart(3,"0")}
</div>

<h2>${client.nom}</h2>

<p>📍 ${client.adresse}</p>

<div class="choiceTitle">
📦 Morceaux
</div>

${morceauxHTML}

<button
class="addPiece"
onclick="ajouterMorceau(${index})">
➕ Ajouter un morceau
</button>


<div class="choiceTitle">
Client appelé
</div>

<div class="choices">

<button
class="choice yes ${
 client.appele===true?"active":""
}"
onclick="choisirAppel(${index},true)">
Oui
</button>

<button
class="choice no ${
 client.appele===false?"active":""
}"
onclick="choisirAppel(${index},false)">
Pas répondu
</button>

</div>


<div class="choiceTitle">
Vieux
</div>

<div class="choices">

<button
class="choice yes ${
 client.vieux===true?"active":""
}"
onclick="choisirVieux(${index},true)">
Oui, vieux
</button>

<button
class="choice no ${
 client.vieux===false?"active":""
}"
onclick="choisirVieux(${index},false)">
Pas de vieux
</button>

</div>


<button
class="done ${
 client.fait?"active":""
}"
onclick="clientFait(${index})">

${
 client.fait
 ? "✅ Client fait à "+client.heure
 : "🚚 Client fait"
}

</button>

`;

liste.appendChild(div);

});

mettreAJourCompteurs();
}


function ajouterMorceau(index){

const morceau=
prompt("Quel morceau/appareil faut-il ajouter ?");

if(!morceau)return;

journeeActuelle
 .clients[index]
 .morceaux
 .push(morceau);

sauvegarderJournee();
afficherClients();
}


function supprimerMorceau(clientIndex,pieceIndex){

journeeActuelle
 .clients[clientIndex]
 .morceaux
 .splice(pieceIndex,1);

sauvegarderJournee();
afficherClients();
}


function choisirAppel(index,valeur){

journeeActuelle
 .clients[index]
 .appele=valeur;

sauvegarderJournee();
afficherClients();
}


function choisirVieux(index,valeur){

journeeActuelle
 .clients[index]
 .vieux=valeur;

sauvegarderJournee
