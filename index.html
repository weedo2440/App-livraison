/* =====================================================
STRUCTURE OFFICIELLE DE LA FEUILLE
===================================================== */

entete:{
 entreprise:"",

},

DONNÉES

function mapsUrl(address){

}


/* =====================================================
CRÉATION CLIENT
===================================================== */

function emptyClient(){

return {

sequence:"",

no_cns:"",

nom_client:"",

code_secondaire:null,

adresse:"",

ville:"",

code_postal:null,

telephones:[],

qte_totale:0,

a_recevoir:0,

montant_livre:null,

items:[],

poids_total_connaissement:0,

appele:null,

vieux:null,

fait:false,

heure_fait:null

};

}


function emptyItem(){

return {

seq_item:1,

no_ptr:"",

code_modele:"",

code_categorie:"",

description:"",

qte_charge:1,

poids:0,

poids_total:0

};

}


/* =====================================================
NORMALISATION TEXTE
===================================================== */

function normalize(text){

return text
.replace(/\r/g,"")
.replace(/\u00a0/g," ")
.replace(/[|]/g," ")
.replace(/[‐-‒–—]/g,"-")
.replace(/[ \t]+/g," ")
.replace(/\n{3,}/g,"\n\n")
.trim();

}


function lines(text){

return normalize(text)
.split("\n")
.map(x=>x.trim())
.filter(x=>x.length>1);

}


/* =====================================================
REGEX TÉLÉPHONE
===================================================== */

function phonesFrom(text){

const result=[];

const patterns=[

/(?:\+?1[\s.-]?)?\(?\d{3}\)?[\s.-]\d{3}[\s.-]\d{4}(?:\s*(?:EXT|EXTENSION|X)\s*\d+)?/gi,

/\b\d{10}\b/g

];

patterns.forEach(pattern=>{

const found=text.match(pattern);

if(found){

found.forEach(p=>{

const clean=p.trim();

if(!result.includes(clean)){
 result.push(clean);
}

});

}

});

return result;

}


/* =====================================================
CODE POSTAL
===================================================== */

function postalFrom(text){

const match=
text.match(
/\b[A-Z]\d[A-Z][ -]?\d[A-Z]\d\b/i
);

return match
?
match[0].replace(/\s/g,"").toUpperCase()
:
"";

}


/* =====================================================
MONTANT
===================================================== */

function moneyFrom(text){

const match=
text.match(
/(?:\$|\b)(\d{1,5}(?:[.,]\d{2}))/ 
);

if(!match){
 return null;
}

return parseFloat(
match[1].replace(",",".")
);

}


/* =====================================================
QUANTITÉ
===================================================== */

function quantityFrom(text){

const patterns=[

/(?:qte|qt[eé]|qty)[\s:.#-]*(\d+)/i,

/\b(\d+)\s*(?:x|unités?|unites?)\b/i

];

for(const p of patterns){

const m=text.match(p);

if(m){
 return parseInt(m[1],10);
}

}

return null;

}


/* =====================================================
DÉTECTION CATÉGORIE
===================================================== */

function categoryFrom(text){

const t=text.toLowerCase();

if(/\bvre\b/.test(t)) return "VRE";
if(/\bcin\b/.test(t)) return "CIN";
if(/\brpf\b/.test(t)) return "RPF";
if(/\blve\b/.test(t)) return "LVE";
if(/\bhotte\b/.test(t)) return "VRE";
if(/\bcuisini/.test(t)) return "CIN";
if(/\br[eé]frig/.test(t)) return "RPF";
if(/\blave[- ]?vaisselle/.test(t)) return "LVE";

return "";

}


/* =====================================================
DÉTECTION APPAREIL
===================================================== */

function looksItem(text){

const t=text.toLowerCase();

return [

"vre",
"cin",
"rpf",
"lve",
"hotte",
"cuisinière",
"cuisiniere",
"réfrigérateur",
"refrigerateur",
"lave-vaisselle",
"lave vaisselle",
"four",
"micro-onde",
"microonde",
"sécheuse",
"secheuse",
"laveuse",
"washer",
"dryer"

].some(x=>t.includes(x));

}


/* =====================================================
CODE MODÈLE
===================================================== */

function modelFrom(text){

const matches=
text.match(
/\b[A-Z0-9]{5,18}\b/gi
);

if(!matches){
 return "";
}

for(const x of matches){

if(
/[A-Z]/i.test(x) &&
/\d/.test(x) &&
!/^0+$/.test(x)
){

return x;

}

}

return "";

}


/* =====================================================
NUMÉRO PIÈCE
===================================================== */

function ptrFrom(text){

const matches=
text.match(/\b\d{5,9}\b/g);

if(!matches){
 return "";
}

return matches[0];

}


/* =====================================================
NUMÉRO DE COMPTE
===================================================== */

function accountFrom(text){

const matches=
text.match(/\b\d{7,9}\b/g);

if(!matches){
 return "";
}

return matches[0];

}


/* =====================================================
SÉQUENCE
===================================================== */

function sequenceFrom(text){

const patterns=[

/^\s*(\d{3})\b/,

/\b(?:seq|séq|sequence|séquence)[\s:#.-]*(\d{1,4})/i

];

for(const p of patterns){

const m=text.match(p);

if(m){
 return m[1].padStart(3,"0");
}

}

return "";

}


/* =====================================================
DÉTECTION NOM
===================================================== */

function looksName(text){

if(!text) return false;

if(phonesFrom(text).length) return false;

if(postalFrom(text)) return false;

if(looksItem(text)) return false;

if(/\b(rue|avenue|av|boulevard|blvd|chemin|route|rang|montée|place|dr|drive|street|road)\b/i.test(text)){
 return false;
}

const letters=
(text.match(/[A-Za-zÀ-ÿ]/g)||[]).length;

return letters>=4;

}


/* =====================================================
DÉTECTION ADRESSE
===================================================== */

function looksAddress(text){

return (

/\b\d{1,6}[, ]+/.test(text) &&

/\b(rue|avenue|av|boulevard|blvd|chemin|route|rang|montée|place|dr|drive|street|road|st)\b/i
.test(text)

)

||

/\b[A-Z]\d[A-Z][ -]?\d[A-Z]\d\b/i.test(text);

}


/* =====================================================
VILLE
===================================================== */

function cityFrom(text){

const cities=[

"BOUCHERVILLE",
"LONGUEUIL",
"MONTRÉAL",
"MONTREAL",
"SAINT-HUBERT",
"ST-HUBERT",
"SAINTE-JULIE",
"BELOEIL",
"CHAMBLY",
"VARENNES",
"BOISBRIAND",
"LAVAL",
"TERREBONNE",
"REPENTIGNY",
"BLainville".toUpperCase(),
"ROSEMÈRE",
"RIVE-SUD",
"RIVE-SUD DE MONTRÉAL"

];

const upper=text.toUpperCase();

for(const city of cities){

if(upper.includes(city)){
 return city;
}

}

return "";

}


/* =====================================================
DÉTECTION CLIENT
===================================================== */

function looksClientStart(line,index){

const seq=sequenceFrom(line);

const phone=phonesFrom(line);

const account=accountFrom(line);

return (

!!seq ||

(
!!account &&
looksName(line)
) ||

(
index===0 &&
looksName(line)
)

);

}


/* =====================================================
PARSER PRINCIPAL
===================================================== */

function parseRouteText(text){

const ls=lines(text);

const result=newRoute();

let current=null;

let itemCounter=0;


/* -----------------------------------------------
ENTÊTE
------------------------------------------------ */

for(let i=0;i<Math.min(ls.length,20);i++){

const line=ls[i];
const upper=line.toUpperCase();

if(
upper.includes("CORBEIL") ||
upper.includes("ELECTROMENAGERS")
){

result.entete.entreprise=line;

}

if(
/camion/i.test(line)
){

const m=line.match(
/camion[\s:#-]*([A-Z0-9-]+)/i
);

if(m){
 result.entete.camion=m[1];
}

}

if(
/route/i.test(line)
){

const m=line.match(
/route[\s:#-]*(\S+)/i
);

if(m){
 result.entete.route=m[1];
}

}

if(
/page/i.test(line)
){

const m=line.match(
/page[\s:#-]*(\d+)/i
);

if(m){
 result.entete.page=parseInt(m[1],10);
}

}

if(
/heure.*impression/i.test(line)
){

const m=line.match(
/(\d{1,2}:\d{2})/
);

if(m){
 result.entete.heure_impression=m[1];
}

}

}


/* -----------------------------------------------
CLIENTS
------------------------------------------------ */

for(let i=0;i<ls.length;i++){

const line=ls[i];

const next=ls[i+1]||"";


/*
Un numéro de séquence de 3 chiffres
est notre meilleur point d'ancrage.
*/

const seq=sequenceFrom(line);

const newClient=
!!seq &&
(
/^\d{3}\b/.test(line) ||
/(?:seq|séq|sequence|séquence)/i.test(line)
);


if(newClient){

if(current){

finalizeClient(
current,
result.clients
);

}

current=emptyClient();

current.sequence=seq;

itemCounter=0;

continue;

}


/*
Si aucun client existe encore,
on cherche un premier bloc client.
*/

if(!current){

if(
looksName(line) ||
looksAddress(line) ||
phonesFrom(line).length
){

current=emptyClient();

}

}


if(!current){
 continue;
}


/* téléphone */

const phones=
phonesFrom(line);

phones.forEach(p=>{

if(!current.telephones.includes(p)){
 current.telephones.push(p);
}

});


/* code postal */

const postal=
postalFrom(line);

if(postal){
 current.code_postal=postal;
}


/* ville */

const city=
cityFrom(line);

if(city){
 current.ville=city;
}


/* adresse */

if(looksAddress(line)){

if(!current.adresse){

current.adresse=line;

}else{

current.adresse+=" "+line;

}

}


/* compte */

const account=
accountFrom(line);

if(
account &&
!current.no_cns &&
!looksItem(line)
){

current.no_cns=account;

}


/* code secondaire */

const secondary=
line.match(
/\*+\s*([0-9]{4}-[0-9]{4,8})/
);

if(secondary){

current.code_secondaire=
secondary[1];

}


/* montant */

const money=
moneyFrom(line);

if(
money!==null &&
/recevoir|recevoir|mnt|montant/i.test(line)
){

current.a_recevoir=money;

}


/* quantité */

const qty=
quantityFrom(line);

if(
qty!==null &&
!looksItem(line)
){

current.qte_totale=qty;

}


/* ------------------------------------------------
ITEM
------------------------------------------------- */

if(looksItem(line)){

const item=emptyItem();

item.seq_item=
++itemCounter;

item.no_ptr=
ptrFrom(line);

item.code_modele=
modelFrom(line);

item.code_categorie=
categoryFrom(line);

item.description=
line;

item.qte_charge=
quantityFrom(line) || 1;

const weight=
line.match(
/\b(\d+(?:[.,]\d+)?)\s*(?:kg|kgs|lb|lbs)\b/i
);

if(weight){

item.poids=
parseFloat(
weight[1].replace(",",".")
);

}

item.poids_total=
item.poids*
item.qte_charge;

current.items.push(item);

}


/* ------------------------------------------------
NOM
------------------------------------------------- */

if(
!current.nom_client &&
looksName(line) &&
!looksItem(line) &&
!looksAddress(line)
){

/*
On évite de prendre les entêtes
comme nom.
*/

if(
!/corbeil|électroménager|entreprise|client|adresse|téléphone|telephone|route|camion/i
.test(line)
){

current.nom_client=line;

}

}


/*
Si une ligne suivante commence un
nouveau client sans séquence explicite,
on ferme le précédent.
*/

if(
current.nom_client &&
current.adresse &&
next &&
looksName(next) &&
!looksItem(next) &&
!phonesFrom(next).length
){

/*
On ne ferme que si la ligne suivante
ne ressemble pas à une continuation
d'adresse.
*/

if(
!looksAddress(next)
){

finalizeClient(
current,
result.clients
);

current=null;

}

}

}


/* dernier client */

if(current){

finalizeClient(
current,
result.clients
);

}


/* recalcul des poids */

result.clients.forEach(client=>{

client.qte_totale=
client.items.reduce(
(sum,item)=>
sum+
Number(item.qte_charge||0),
0
);

client.poids_total_connaissement=
client.items.reduce(
(sum,item)=>
sum+
Number(item.poids_total||0),
0
);

});


/*
Si aucun séquence n'a été trouvé,
on numérote quand même les clients.
*/

result.clients.forEach(
(client,index)=>{

if(!client.sequence){

client.sequence=
String(index+1).padStart(3,"0");

}

});


return result;

}


/* =====================================================
FINALISATION CLIENT
===================================================== */

function finalizeClient(client,list){

if(
!client.nom_client &&
!client.adresse &&
!client.telephones.length &&
!client.items.length
){

return;

}


if(
!client.nom_client
){

client.nom_client=
"Client "+
String(list.length+1).padStart(3,"0");

}


if(
!client.qte_totale
){

client.qte_totale=
client.items.reduce(
(sum,item)=>
sum+Number(item.qte_charge||1),
0
);

}


client.poids_total_connaissement=
client.items.reduce(
(sum,item)=>
sum+Number(item.poids_total||0),
0
);


list.push(client);

}


/* =====================================================
OCR AVEC COORDONNÉES
===================================================== */

async function readOCR(file){

const status=
document.getElementById("ocrStatus");

const message=
document.getElementById("ocrText");

const bar=
document.getElementById("progressBar");

status.classList.remove("hidden");

message.textContent=
"🔎 Chargement du moteur OCR...";

bar.style.width="5%";


/*
Tesseract recommande une image suffisamment
résolue et indique que l'upscaling peut
améliorer la reconnaissance.
*/

const worker=
await Tesseract.createWorker(
"fra+eng",
1,
{

logger:m=>{

if(

/* =====================================================
PHOTO
===================================================== */

function selectPhoto(file){

if(!file)return;

selectedFile=file;

const img=
document.getElementById("photoPreview");

img.src=
URL.createObjectURL(file);

img.classList.remove("hidden");

document
.getElementById("readBtn")
.classList.remove("hidden");

}


/* caméra */

document
.getElementById("cameraBtn")
.addEventListener(
"click",
()=>document
.getElementById("cameraInput")
.click()
);

document
.getElementById("cameraInput")
.addEventListener(
"change",
e=>selectPhoto(e.target.files[0])
);


/* galerie */

document
.getElementById("galleryBtn")
.addEventListener(
"click",
()=>document
.getElementById("galleryInput")
.click()
);

document
.getElementById("galleryInput")
.addEventListener(
"change",
e=>selectPhoto(e.target.files[0])
);


/* =====================================================
LIRE FEUILLE
===================================================== */

document
.getElementById("readBtn")
.addEventListener(
"click",
async()=>{

if(!selectedFile){
 return;
}

try{

const result=
await readOCR(selectedFile);

const text=
result?.data?.text || "";


/*
Le texte brut sert de base.
Les blocs/TSV sont disponibles
pour les futures améliorations de
positionnement.
*/

if(!text.trim()){

alert(
"Je n'ai détecté aucun texte sur la photo."
);

return;

}


document
.getElementById("ocrText")
.textContent=
"🧠 Organisation des clients...";


const parsed=
parseRouteText(text);


/*
Nouvelle journée
*/

currentDay={
date:today(),
route:parsed,
clients:parsed.clients
};

route=parsed;


historyData.push(currentDay);

save();


show("day");

renderDay();


if(parsed.clients.length===0){

alert(
"Du texte a été lu, mais aucun client n'a été identifié. Tu peux les ajouter manuellement."
);

}


}catch(error){

console.error(error);

alert(
"Erreur pendant la lecture de la feuille."
);

}

});


/* =====================================================
COMPTEURS
===================================================== */

function pieceCount(day){

if(!day)return 0;

return day.clients.reduce(
(sum,c)=>
sum+
Number(c.qte_totale||c.items?.length||0),
0
);

}


function updateCounters(){

if(!currentDay)return;

document.getElementById("dayClients")
.textContent=
currentDay.clients.length;

document.getElementById("dayPieces")
.textContent=
pieceCount(currentDay);

document.getElementById("homeClients")
.textContent=
currentDay.clients.length;

document.getElementById("homePieces")
.textContent=
pieceCount(currentDay);

}


/* =====================================================
AFFICHAGE JOURNÉE
===================================================== */

function renderDay(){

if(!currentDay)return;

document.getElementById("dayDate")
.textContent=
currentDay.date;

updateCounters();

renderClients();

renderSummary();

}


/* =====================================================
AFFICHAGE CLIENTS
===================================================== */

function renderClients(){

const box=
document.getElementById("clients");

box.innerHTML="";


currentDay.clients.forEach(
(client,index)=>{

const div=
document.createElement("div");

div.className=
"client"+
(
client.fait
?
" done"
:
""
);


let itemsHTML="";


client.items.forEach(
(item,itemIndex)=>{

itemsHTML+=`

<div class="piece">

<div>
📦 <strong>
${esc(item.code_categorie || "")}
</strong>
<br>
${esc(item.description)}
<br>
<span class="small">
${esc(item.code_modele)}
 · ${esc(item.no_ptr)}
 · Qté ${item.qte_charge}
</span>
</div>

<button
class="deletePiece"
onclick="deleteItem(${index},${itemIndex})">
✕
</button>

</div>

`;

});


div.innerHTML=`

<div class="clientNumber">
CLIENT ${esc(client.sequence || String(index+1).padStart(3,"0"))}
</div>

<label>👤 Nom</label>

<input
value="${esc(client.nom_client)}"
onchange="updateClient(${index},'nom_client',this.value)"
>

<label>🔢 No CNS</label>

<input
value="${esc(client.no_cns)}"
onchange="updateClient(${index},'no_cns',this.value)"
>

<label>📞 Téléphone</label>

<input
value="${esc(
(client.telephones||[]).join(" / ")
)}"
onchange="updatePhones(${index},this.value)"
type="tel"
>

<label>📍 Adresse</label>

<input
value="${esc(client.adresse)}"
onchange="updateClient(${index},'adresse',this.value)"
>

<label>🏙️ Ville</label>

<input
value="${esc(client.ville)}"
onchange="updateClient(${index},'ville',this.value)"
>

<label>📮 Code postal</label>

<input
value="${esc(client.code_postal || "")}"
onchange="updateClient(${index},'code_postal',this.value)"
>

<div class="row">

<button
class="blue"
onclick="openMaps(${index})">
🗺️ Maps
</button>

<button
class="gray"
onclick="openImages(${index})">
🖼️ Images
</button>

</div>

<hr>

<strong>📦 Produits : ${client.items.length}</strong>

${itemsHTML}

<button
class="gray"
onclick="addItem(${index})">
➕ Ajouter un appareil
</button>

<label>💰 À recevoir</label>

<input
type="number"
step="0.01"
value="${client.a_recevoir ?? 0}"
onchange="updateNumber(${index},'a_recevoir',this.value)"
>

<label>💵 Montant livré</label>

<input
type="number"
step="0.01"
value="${client.montant_livre ?? ""}"
onchange="updateNumber(${index},'montant_livre',this.value)"
>

<hr>

<strong>📞 Appelé</strong>

<div class="choice">

<button
class="${client.appele===true?'activeBlue':''}"
onclick="setChoice(${index},'appele',true)">
📞 Oui
</button>

<button
class="${client.appele===false?'activeRed':''}"
onclick="setChoice(${index},'appele',false)">
❌ Non
</button>

</div>

<strong>♻️ Vieux</strong>

<div class="choice">

<button
class="${client.vieux===true?'activeGreen':''}"
onclick="setChoice(${index},'vieux',true)">
🟢 Vieux rapporté
</button>

<button
class="${client.vieux===false?'activeRed':''}"
onclick="setChoice(${index},'vieux',false)">
🔴 Pas de vieux
</button>

</div>

<button
class="${client.fait?'green':'blue'}"
onclick="toggleDone(${index})">

${
client.fait
?
"✅ Client fait à "+esc(client.heure_fait)
:
"🚚 Client fait"
}

</button>

<button
class="removeClient"
onclick="removeClient(${index})">
🗑️ Supprimer
</button>

`;

box.appendChild(div);

});

}


/* =====================================================
MODIFICATION CLIENT
===================================================== */

function updateClient(index,key,value){

currentDay.clients[index][key]=value;

saveCurrentDay();

renderSummary();

}


function updateNumber(index,key,value){

currentDay.clients[index][key]=
value===""
?
null
:
Number(value);

saveCurrentDay();

}


function updatePhones(index,value){

currentDay.clients[index].telephones=
value
.split("/")
.map(x=>x.trim())
.filter(Boolean);

saveCurrentDay();

}


/* =====================================================
ITEM
===================================================== */

function addItem(index){

const item=emptyItem();

item.seq_item=
currentDay.clients[index].items.length+1;

const description=
prompt(
"Description de l'appareil :"
);

if(!description){
 return;
}

item.description=description;

const model=
prompt(
"Code modèle :"
);

if(model){
 item.code_modele=model;
}

const category=
prompt(
"Catégorie (VRE, CIN, RPF, LVE...) :"
);

if(category){
 item.code_categorie=category;
}

const ptr=
prompt(
"No pièce / produit :"
);

if(ptr){
 item.no_ptr=ptr;
}

currentDay.clients[index].items.push(item);

recalculateClient(index);

saveCurrentDay();

renderDay();

}


function deleteItem(clientIndex,itemIndex){

currentDay.clients[
clientIndex
].items.splice(
itemIndex,
1
);

recalculateClient(clientIndex);

saveCurrentDay();

renderDay();

}


function recalculateClient(index){

const c=
currentDay.clients[index];

c.qte_totale=
c.items.reduce(
(sum,x)=>
sum+
Number(x.qte_charge||1),
0
);

c.poids_total_connaissement=
c.items.reduce(
(sum,x)=>
sum+
Number(x.poids_total||0),
0
);

}


/* =====================================================
ACTIONS
===================================================== */

function setChoice(index,key,value){

currentDay.clients[index][key]=value;

saveCurrentDay();

renderDay();

}


function toggleDone(index){

const c=
currentDay.clients[index];

c.fait=!c.fait;

c.heure_fait=
c.fait
?
now()
:
null;

saveCurrentDay();

renderDay();

}


function removeClient(index){

if(!confirm("Supprimer ce client ?")){
 return;
}

currentDay.clients.splice(index,1);

currentDay.clients.forEach(
(c,i)=>{
 c.sequence=
 String(i+1).padStart(3,"0");
}
);

saveCurrentDay();

renderDay();

}


function addManualClient(){

if(!currentDay){

currentDay={
date:today(),
route:newRoute(),
clients:[]
};

currentDay.route.clients=
currentDay.clients;

historyData.push(currentDay);

}

const c=emptyClient();

c.sequence=
String(
currentDay.clients.length+1
).padStart(3,"0");

c.nom_client=
"Client "+
c.sequence;

currentDay.clients.push(c);

saveCurrentDay();

renderDay();

show("day");

}


/* =====================================================
RÉSUMÉ
===================================================== */

function renderSummary(){

const box=
document.getElementById("summary");

box.innerHTML="";


if(!currentDay ||
!currentDay.clients.length){

box.textContent="Aucun client.";

return;

}


currentDay.clients.forEach(
(c,i)=>{

const div=
document.createElement("div");

div.className="summaryLine";

div.innerHTML=
"<strong>"+
esc(c.sequence || String(i+1).padStart(3,"0"))+
"</strong> · "+
esc(c.nom_client)+
"<br>"+
(
c.adresse
?
"📍 "+esc(c.adresse)
:
"⚠️ Adresse manquante"
)+
(
c.telephones?.length
?
"<br>📞 "+esc(c.telephones.join(" / "))
:
""
);

box.appendChild(div);

});

}


/* =====================================================
MAPS
===================================================== */

function openMaps(index){

const c=
currentDay.clients[index];

const address=[
c.adresse,
c.ville,
c.code_postal
]
.filter(Boolean)
.join(", ");

if(!address){

alert("Adresse manquante.");

return;

}

window.open(
mapsUrl(address),
"_blank"
);

}


function openImages(index){

const c=
currentDay.clients[index];

const address=[
c.adresse,
c.ville
]
.filter(Boolean)
.join(", ");

if(!address){

alert("Adresse manquante.");

return;

}

window.open(
imageUrl(address),
"_blank"
);

}


function openAllMaps(){

const addresses=
currentDay.clients
.map(c=>
[
c.adresse,
c.ville,
c.code_postal
]
.filter(Boolean)
.join(", ")
)
.filter(Boolean);

if(addresses.length<1){

alert("Aucune adresse.");

return;

}

const destination=
addresses[addresses.length-1];

const waypoints=
addresses.slice(0,-1).join("|");

let url=
"https://www.google.com/maps/dir/?api=1"+
"&destination="+
encodeURIComponent(destination);

if(waypoints){

url+=
"&waypoints="+
encodeURIComponent(waypoints);

}

url+="&travelmode=driving";

window.open(url,"_blank");

}


function optimize(){

openAllMaps();

}


/* =====================================================
SAUVEGARDE
===================================================== */

function saveCurrentDay(){

if(!currentDay)return;

const index=
historyData.indexOf(currentDay);

if(index===-1){

historyData.push(currentDay);

}

save();

updateCounters();

}


/* =====================================================
HISTORIQUE
===================================================== */

function renderHistory(){

const box=
document.getElementById("historyList");

box.innerHTML="";


if(!historyData.length){

box.innerHTML=
"<p>Aucune journée enregistrée.</p>";

return;

}


historyData
.slice()
.reverse()
.forEach(
(day,reverseIndex)=>{

const realIndex=
historyData.length-
1-
reverseIndex;

const b=
document.createElement("button");

b.className="historyItem";

b.innerHTML=
"📅 <strong>"+
esc(day.date)+
"</strong><br>"+
"<span class='small'>"+
day.clients.length+
" clients · "+
pieceCount(day)+
" morceaux"+
"</span>";

b.onclick=
()=>openHistory(realIndex);

box.appendChild(b);

});

}


function openHistory(index){

const day=
historyData[index];

if(!day)return;

document
.getElementById("detailTitle")
.textContent=
"📅 "+day.date;

document
.getElementById("detailClientCount")
.textContent=
day.clients.length;

document
.getElementById("detailPieceCount")
.textContent=
pieceCount(day);


const box=
document.getElementById("detailList");

box.innerHTML="";


day.clients.forEach(
c=>{

const d=
document.createElement("div");

d.className="client";

d.innerHTML=
`
<div class="clientNumber">
CLIENT ${esc(c.sequence)}
</div>

<h2>${esc(c.nom_client)}</h2>

<p>🔢 ${esc(c.no_cns)}</p>

<p>📞 ${esc((c.telephones||[]).join(" / "))}</p>

<p>
📍 ${esc(c.adresse)}
<br>
${esc(c.ville)}
${c.code_postal?" "+esc(c.code_postal):""}
</p>

<p>
📦 ${c.qte_totale||0} morceau(x)
</p>

<p>
${c.fait?"✅ Fait à "+esc(c.heure_fait):"⏳ Pas fait"}
</p>
`;

box.appendChild(d);

});


show("detail");

}


/* =====================================================
NAVIGATION
===================================================== */

document
.getElementById("newDay")
.onclick=
()=>{

currentDay={
 date:today(),
 route:newRoute(),
 clients:[]
};

currentDay.route.clients=
currentDay.clients;

historyData.push(currentDay);

save();

renderDay();

show("day");

};


document
.getElementById("addClient")
.onclick=
addManualClient;


document
.getElementById("maps")
.onclick=
openAllMaps;


document
.getElementById("optimize")
.onclick=
optimize;


document
.getElementById("historyBtn")
.onclick=
()=>{

renderHistory();

show("history");

};


document
.getElementById("backHome")
.onclick=
()=>{

updateHome();

show("home");

};


document
.getElementById("backHistory")
.onclick=
()=>{

show("home");

};


document
.getElementById("backDetail")
.onclick=
()=>{

renderHistory();

show("history");

};


/* =====================================================
ACCUEIL
===================================================== */

function updateHome(){

document
.getElementById("today")
.textContent=
today();

if(currentDay){

document
.getElementById("homeClients")
.textContent=
currentDay.clients.length;

document
.getElementById("homePieces")
.textContent=
pieceCount(currentDay);

}

}


/* =====================================================
DÉMARRAGE
===================================================== */

updateHome();

</script>

</body>
</html>
