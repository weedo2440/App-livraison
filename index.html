<!DOCTYPE html>
<html lang="fr">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>0MRCX LIVRER</title>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#eef1f5;
  color:#111827;
  font-family:Arial,Helvetica,sans-serif;
}

header{
  background:#111827;
  color:white;
  padding:16px;
  text-align:center;
  position:sticky;
  top:0;
  z-index:20;
}

header h1{
  margin:0;
  font-size:22px;
}

main{
  max-width:700px;
  margin:auto;
  padding:12px;
}

.card{
  background:white;
  border-radius:15px;
  padding:15px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0002;
}

button{
  width:100%;
  border:0;
  border-radius:11px;
  padding:14px;
  margin:5px 0;
  font-size:16px;
  font-weight:bold;
}

.blue{
  background:#2563eb;
  color:white;
}

.dark{
  background:#111827;
  color:white;
}

.green{
  background:#16a34a;
  color:white;
}

.red{
  background:#dc2626;
  color:white;
}

.orange{
  background:#f59e0b;
  color:white;
}

.gray{
  background:#e5e7eb;
  color:#111827;
}

.hidden{
  display:none!important;
}

.small{
  font-size:13px;
  color:#6b7280;
}

.big{
  font-size:25px;
  font-weight:bold;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.stat{
  background:#f3f4f6;
  padding:12px;
  border-radius:10px;
  text-align:center;
}

.photoButtons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
}

.photoButtons button{
  margin:0;
}

.photoInput{
  display:none;
}

#photoPreview{
  width:100%;
  max-height:500px;
  object-fit:contain;
  border-radius:12px;
  margin-top:12px;
  display:none;
}

#ocrStatus{
  background:#f8fafc;
  border-radius:10px;
  padding:12px;
  margin-top:10px;
}

.progress{
  width:100%;
  height:12px;
  background:#e5e7eb;
  border-radius:20px;
  overflow:hidden;
  margin-top:8px;
}

.progressBar{
  height:100%;
  width:0%;
  background:#2563eb;
  transition:width .2s;
}

.client{
  background:white;
  border-radius:15px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:0 2px 8px #0002;
}

.client.done{
  border:3px solid #22c55e;
}

.clientNumber{
  font-size:13px;
  font-weight:bold;
  color:#6b7280;
}

label{
  display:block;
  font-weight:bold;
  margin-top:8px;
}

input{
  width:100%;
  padding:12px;
  border:2px solid #ddd;
  border-radius:10px;
  font-size:16px;
  margin:4px 0 8px;
}

.row{
  display:flex;
  gap:7px;
}

.row button{
  flex:1;
}

.choice{
  display:flex;
  gap:7px;
}

.choice button{
  flex:1;
}

.activeBlue{
  background:#2563eb!important;
  color:white!important;
}

.activeGreen{
  background:#16a34a!important;
  color:white!important;
}

.activeRed{
  background:#dc2626!important;
  color:white!important;
}

.piece{
  background:#f3f4f6;
  border-radius:8px;
  padding:9px;
  margin:5px 0;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.deletePiece{
  width:auto;
  padding:7px 10px;
  background:#dc2626;
  color:white;
  margin:0;
}

.summaryLine{
  background:#f3f4f6;
  padding:9px;
  border-radius:8px;
  margin:5px 0;
}

.removeClient{
  background:#fee2e2;
  color:#991b1b;
}

.historyItem{
  background:white;
  border:2px solid #ddd;
  text-align:left;
}

#ocrRaw{
  white-space:pre-wrap;
  background:#111827;
  color:#e5e7eb;
  padding:12px;
  border-radius:10px;
  max-height:250px;
  overflow:auto;
  font-size:12px;
}

</style>

</head>

<body>

<header>
<h1>🚚 0MRCX LIVRER</h1>
</header>

<main>


<!-- =========================
ACCUEIL

<section id="home">

<div class="card">

</div>

<input

<input

JOURNÉE

<section id="day" class="hidden">

<div class="card">

</div>

<!-- =========================
HISTORIQUE
========================= -->

<section id="history" class="hidden">

<button class="gray" id="backHistoryBtn">
⬅️ Retour
</button>

<div class="card">

<h2>📅 Historique</h2>

<div id="historyList"></div>

</div>

</section>


<!-- =========================
DÉTAIL HISTORIQUE
========================= -->

<section id="historyDetail" class="hidden">

<button class="gray" id="backDetailBtn">
⬅️ Retour
</button>

<div class="card">

<h2 id="detailTitle"></h2>

<div class="stats">

<div class="stat">
<div class="big" id="detailClients">0</div>
<div class="small">Clients</div>
</div>

<div class="stat">
<div class="big" id="detailPieces">0</div>
<div class="small">Morceaux</div>
</div>

</div>

</div>

<div id="detailClientsList"></div>

</section>

</main>


<script>

"use strict";


/* =====================================================
DONNÉES
===================================================== */

let currentDay=null;

let historyData=[];

let selectedPhoto=null;


try{

const saved=
localStorage.getItem("omrcx_history");

if(saved){
historyData=JSON.parse(saved);
}

if(!Array.isArray(historyData)){
historyData=[];
}

}catch(e){

historyData=[];

try{
localStorage.removeItem("omrcx_history");
}catch(x){}

}


/* =====================================================
OUTILS
===================================================== */

function today(){

return new Date()
.toLocaleDateString("fr-CA");

}


function timeNow(){

return new Date()
.toLocaleTimeString(
"fr-CA",
{
hour:"2-digit",
minute:"2-digit"
}
);

}


function save(){

try{

localStorage.setItem(
"omrcx_history",
JSON.stringify(historyData)
);

}catch(e){

console.log(e);

}

}


function show(id){

document
.querySelectorAll("main section")
.forEach(
section=>{
section.classList.add("hidden");
}
);

document
.getElementById(id)
.classList.remove("hidden");

}


function escapeHTML(value){

return String(value || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function mapsLink(address){

return "https://www.google.com/maps/dir/?api=1&destination="+
encodeURIComponent(address);

}


function imageLink(address){

return "https://www.google.com/search?tbm=isch&q="+
encodeURIComponent(address);

}


/* =====================================================
COMPTEURS
===================================================== */

function countPieces(day){

if(!day || !Array.isArray(day.clients)){
return 0;
}

let total=0;

day.clients.forEach(client=>{

if(client.fait){

total+=
Array.isArray(client.pieces)
?
client.pieces.length
:
0;

}

});

return total;

}


function updateCounters(){

if(!currentDay){
return;
}

document.getElementById("dayClients")
.textContent=
currentDay.clients.length;

document.getElementById("dayPieces")
.textContent=
countPieces(currentDay);

document.getElementById("homeClients")
.textContent=
currentDay.clients.length;

document.getElementById("homePieces")
.textContent=
countPieces(currentDay);

}


/* =====================================================
JOURNÉE
===================================================== */

function createDay(){

currentDay={

date:today(),

clients:[]

};

historyData.push(currentDay);

save();

show("day");

renderDay();

}


function saveCurrentDay(){

if(!currentDay){
return;
}

const index=
historyData.indexOf(currentDay);

if(index>=0){

historyData[index]=currentDay;

}else{

historyData.push(currentDay);

}

save();

}


function addClient(){

if(!currentDay){

createDay();

return;

}

const number=
currentDay.clients.length+1;

currentDay.clients.push({

numero:number,

nom:
"Client "+
String(number).padStart(3,"0"),

telephone:"",

adresse:"",

pieces:[],

appele:null,

vieux:null,

fait:false,

heure:null

});

saveCurrentDay();

renderDay();

}


function removeClient(index){

if(!confirm("Supprimer ce client ?")){
return;
}

currentDay.clients.splice(index,1);

currentDay.clients.forEach(
(client,i)=>{
client.numero=i+1;
}
);

saveCurrentDay();

renderDay();

}


/* =====================================================
AFFICHAGE JOURNÉE
===================================================== */

function renderDay(){

if(!currentDay){
return;
}

document.getElementById("dayDate")
.textContent=
currentDay.date;

updateCounters();

renderClients();

renderSummary();

}
